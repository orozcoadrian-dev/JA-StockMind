<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportes - Imperio Motos SAS</title>
    <link rel="stylesheet" href="../Assets/styles.css" />
  </head>
  <body>
    <div class="page-shell dashboard-shell">
      <header class="site-header dashboard-header">
        <nav class="nav container">
          <div class="brand">
            <span class="brand-mark">IM</span>
            <span>Imperio Motos SAS</span>
          </div>
          <div class="nav-links">
            <a href="../index.html">Inicio</a>
            <a href="inventario.html">Inventarios</a>
            <a href="reportes.html">Reportes</a>
          </div>
          <button class="btn btn-primary" id="loadReportsButton">Actualizar</button>
        </nav>
      </header>

      <main class="reports-page container">
        <section class="panel-header">
          <div>
            <p class="eyebrow">Inteligencia operativa</p>
            <h1>Reportes y métricas</h1>
          </div>
        </section>

        <section class="summary-cards reports-summary">
          <div class="summary-card">
            <span>Pronóstico ingresos</span>
            <strong id="revenueForecast">0</strong>
          </div>
          <div class="summary-card">
            <span>Órdenes cumplidas</span>
            <strong id="fulfilledOrders">0</strong>
          </div>
          <div class="summary-card">
            <span>Ahorro potencial</span>
            <strong id="potentialSavings">0</strong>
          </div>
        </section>

        <section class="reports-grid">
          <article class="report-card">
            <div class="card-header report-header">
              <span class="status-dot"></span>
              <span>Distribución por categoría</span>
            </div>
            <div id="categoryDistribution" class="category-bars"></div>
          </article>

          <article class="report-card">
            <div class="card-header report-header">
              <span class="status-dot"></span>
              <span>Recomendaciones del agente</span>
            </div>
            <ul id="recommendationList" class="recommendation-list"></ul>
          </article>
        </section>

        <section class="reports-grid secondary-grid">
          <article class="report-card">
            <div class="card-header report-header">
              <span class="status-dot"></span>
              <span>Pronóstico semanal</span>
            </div>
            <div id="forecastChart" class="forecast-chart"></div>
          </article>

          <article class="report-card">
            <div class="card-header report-header">
              <span class="status-dot"></span>
              <span>Actividad reciente</span>
            </div>
            <ul id="activityFeed" class="activity-feed"></ul>
          </article>
        </section>
      </main>
    </div>

    <script src="../Assets/Js/script.js"></script>
  </body>
</html>
